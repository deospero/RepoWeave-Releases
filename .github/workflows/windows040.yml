{
  "name": "Build, install and verify RepoWeave on Windows",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        "release-inputs/0.4.0/windows-manifest.json"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "repoweave-040-publication",
    "cancel-in-progress": false
  },
  "jobs": {
    "windows": {
      "if": "github.repository == 'deospero/RepoWeave-Releases'",
      "runs-on": "windows-2025",
      "timeout-minutes": 25,
      "env": {
        "PYTHONUTF8": "1",
        "RELEASE_SHA": "${{ github.sha }}"
      },
      "steps": [
        {
          "name": "Assemble checksum-verified product and vendor binaries",
          "shell": "python",
          "run": "import urllib.request,hashlib,json,zipfile,os,re,shutil\nfrom pathlib import Path\nrepo='deospero/RepoWeave-Releases';sha=os.environ['RELEASE_SHA'];assert re.fullmatch('[0-9a-f]{40}',sha)\nbase='https://raw.githubusercontent.com/'+repo+'/'+sha+'/release-inputs/0.4.0/'\ndef get(url):\n with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'RepoWeave-release-verification'}),timeout=120)as r:\n  data=r.read(512*1024*1024);assert not r.read(1);return data\nmeta=json.loads(get(base+'windows-manifest.json'))\nassert meta['version']=='0.4.0'\nfor kind,out,checksum,size in [('payload','payload.zip','payloadSha256','payloadBytes'),('apk','RepoWeave-0.4.0.apk','apkSha256','apkBytes')]:\n parts=meta[kind+'Parts'];assert parts==[f'{kind}-{i:03d}'for i in range(len(parts))]and len(parts)<128\n b=b''.join(get(base+p)for p in parts);assert hashlib.sha256(b).hexdigest()==meta[checksum]and len(b)==meta[size];Path(out).write_bytes(b)\nwith zipfile.ZipFile('payload.zip')as z:z.extractall('incoming')\nelectron='https://github.com/electron/electron/releases/download/v45.5.0/electron-v45.5.0-win32-x64.zip';b=get(electron);assert hashlib.sha256(b).hexdigest()==meta['electronSha256'];Path('electron.zip').write_bytes(b)\nout=Path('build/dist/win-unpacked');out.mkdir(parents=True,exist_ok=True)\nwith zipfile.ZipFile('electron.zip')as z:z.extractall(out)\n(out/'electron.exe').rename(out/'RepoWeave.exe')\n(out/'resources/default_app.asar').unlink(missing_ok=True)\nshutil.copytree('incoming/resources',out/'resources',dirs_exist_ok=True)\nruntime=json.loads(Path('incoming/runtime-source.json').read_text());assert runtime['url'].startswith('https://github.com/adoptium/temurin21-binaries/releases/download/');b=get(runtime['url']);assert hashlib.sha256(b).hexdigest()==runtime['sha256'];Path('runtime.zip').write_bytes(b)\nwith zipfile.ZipFile('runtime.zip')as z:\n prefix=z.namelist()[0].split('/')[0]\n for name in z.namelist():\n  rel=Path(name).relative_to(prefix);assert '..'not in rel.parts\n  if not rel.parts:continue\n  dst=out/'resources/runtime'/rel\n  if name.endswith('/'):dst.mkdir(parents=True,exist_ok=True)\n  else:dst.parent.mkdir(parents=True,exist_ok=True);dst.write_bytes(z.read(name))\ninstaller=Path('build/installer');shutil.copytree('incoming/installer',installer,dirs_exist_ok=True)\n# Normalize source path for native Windows NSIS (the payload keeps the same product bytes).\nnsi=installer/'RepoWeave.nsi';nsi.write_text(nsi.read_text().replace('../dist/win-unpacked/*',r'..\\dist\\win-unpacked\\*'))\nfiles=[p.relative_to(out)for p in out.rglob('*')if p.is_file()];dirs=sorted({p.parent for p in files if str(p.parent)!='.'},key=lambda p:len(p.parts),reverse=True)\nlines=[' Delete \"$INSTDIR\\\\'+str(p).replace('/','\\\\').replace('$','$$')+'\"'for p in files]+[' RMDir \"$INSTDIR\\\\'+str(p).replace('/','\\\\').replace('$','$$')+'\"'for p in dirs]\n(installer/'uninstall-files.nsh').write_text('\\n'.join(lines)+'\\n')\nPath('ci-state.json').write_text(json.dumps(meta))\nprint('Package inputs and vendor runtime checksums verified.')\n\nPath(\"verify-installed.cjs\").write_text(\"// Generated CI-only content and credentials stay on the disposable Windows runner.\\nconst fs=require('fs'),path=require('path'),crypto=require('crypto'),{execFileSync}=require('child_process');\\nconst {_electron}=require(path.join(process.cwd(),'ci/node_modules/playwright'));\\nconst installer=path.resolve('build/installer/RepoWeave-0.4.0-Windows-x64-Setup.exe');\\nconst target=path.join(process.env.LOCALAPPDATA,'Programs','RepoWeave'),exe=path.join(target,'RepoWeave.exe');\\nconst report={platform:process.platform,installer:false,launch:false,ordinaryFiles:false,draftRestart:false,keyboardSave:false,guidedVersion:false,dpapi:false,updatePreservesData:false,uninstallPreservesData:false,nodeIsolation:false};\\nlet app;\\nconst requireTrue=(condition,message)=>{if(!condition)throw Error(message);};\\nasync function launch(){app=await _electron.launch({executablePath:exe,timeout:90000});const page=await app.firstWindow();page.setDefaultTimeout(30000);return page;}\\nasync function call(page,op,args){return page.evaluate(({op,args})=>new Promise((resolve,reject)=>{const original=window.receiveNative,id=String(800000+Math.floor(Math.random()*100000));window.receiveNative=function(r){if(typeof r==='string')r=JSON.parse(r);if(r.id===id){window.receiveNative=original;r.error?reject(Error(r.error)):resolve(r.value);}else original(r)};Native.request(JSON.stringify({id,op,args}));}),{op,args});}\\n(async()=>{\\n execFileSync(installer,['/S'],{timeout:180000});requireTrue(fs.existsSync(exe),'Installation did not create executable');report.installer=true;\\n let page=await launch();await page.waitForSelector('#new-knowledge');report.launch=true;\\n requireTrue(await app.evaluate(({app})=>app.getVersion()==='0.4.0'),'Wrong installed application version');\\n requireTrue(await page.evaluate(()=>typeof require==='undefined'&&typeof process==='undefined'),'Renderer unexpectedly has Node access');report.nodeIsolation=true;\\n const label='CI-'+crypto.randomUUID();await page.locator('#new-knowledge').click();await page.getByRole('button',{name:'Nur auf diesem Ger\\u00e4t erstellen',exact:true}).click();await page.locator('#knowledge-name').fill(label);await page.getByRole('button',{name:'Erstellen',exact:true}).click();await page.waitForFunction(()=>document.querySelector('#doc-path').textContent==='Start.md');\\n await page.locator('button[data-mode=edit]').click();const text='# '+label+'\\\\n\\\\n---\\\\ncustom: '+crypto.randomUUID()+'\\\\n---\\\\n[[Ideen]]\\\\n:::unknown\\\\n';await page.locator('#editor').fill(text);await page.locator('#save-button').click();await page.waitForFunction(()=>document.querySelector('#draft-state').textContent==='Gespeichert');\\n await page.locator('#sync-button').click();await page.waitForSelector('#sync-include');await page.locator('#sync-include').check();await page.getByRole('button',{name:'Jetzt abgleichen',exact:true}).click();await page.waitForFunction(()=>!document.querySelector('#modal').open&&document.querySelector('#change-count').textContent==='0');requireTrue((await page.locator('#toast').innerText()).includes('Version auf diesem Ger\\u00e4t gesichert'),'Guided version feedback failed');report.guidedVersion=true;\\n const id=await page.locator('#repo-select').inputValue(),data=await app.evaluate(({app})=>app.getPath('userData')),file=path.join(data,'repositories',id,'Start.md');requireTrue(fs.readFileSync(file,'utf8')===text,'Saved Markdown bytes differ');report.ordinaryFiles=true;\\n const credential=crypto.randomBytes(32).toString('hex');await call(page,'settings',{repo:id,name:label,email:'local@repoweave.local',token:credential});const encrypted=fs.readFileSync(path.join(data,'credentials.dpapi.json'),'utf8');requireTrue(!encrypted.includes(credential),'Credential was stored as plaintext');const value=JSON.parse(encrypted)[id];requireTrue(await app.evaluate(async({safeStorage},{value,credential})=>{if(!await safeStorage.isAsyncEncryptionAvailable())return false;return(await safeStorage.decryptStringAsync(Buffer.from(value,'base64'))).result===credential;},{value,credential}),'Windows DPAPI roundtrip failed');report.dpapi=true;\\n const draft=text+'\\\\n'+crypto.randomUUID()+'\\\\n';await page.locator('#editor').fill(draft);await app.close();app=null;await new Promise(r=>setTimeout(r,1000));\\n page=await launch();await page.waitForFunction(d=>document.querySelector('#editor').value===d,draft);requireTrue(fs.readFileSync(file,'utf8')===text,'Uncommitted draft silently overwrote file');report.draftRestart=true;\\n await page.locator('button[data-mode=edit]').click();await page.locator('#editor').press('Control+s');await page.waitForFunction(()=>document.querySelector('#draft-state').textContent==='Gespeichert');requireTrue(fs.readFileSync(file,'utf8')===draft,'Keyboard save did not persist');report.keyboardSave=true;\\n await app.close();app=null;await new Promise(r=>setTimeout(r,1000));execFileSync(installer,['/S'],{timeout:180000});page=await launch();await page.waitForFunction(d=>document.querySelector('#editor').value===d,draft);requireTrue(fs.readFileSync(file,'utf8')===draft,'Update lost file data');requireTrue(await app.evaluate(async({safeStorage},{value,credential})=>(await safeStorage.decryptStringAsync(Buffer.from(value,'base64'))).result===credential,{value,credential}),'Update lost credentials');report.updatePreservesData=true;await app.close();app=null;await new Promise(r=>setTimeout(r,1000));\\n const keep=path.join(target,'keep-'+crypto.randomUUID()+'.txt');fs.writeFileSync(keep,crypto.randomUUID());execFileSync(path.join(target,'Uninstall.exe'),['/S','_?='+target],{timeout:180000});requireTrue(fs.existsSync(keep)&&fs.existsSync(file),'Uninstaller removed user data');report.uninstallPreservesData=true;\\n fs.writeFileSync('windows-verification.json',JSON.stringify({...report,passed:true},null,2));console.log('Windows installation, launch, Markdown, draft restart, DPAPI, update and safe uninstall passed.');\\n})().catch(e=>{fs.writeFileSync('windows-verification.json',JSON.stringify({...report,passed:false,error:e.message},null,2));console.error(e.message);process.exitCode=1;}).finally(async()=>{if(app)await app.close();});\\n\",encoding=\"utf-8\")\n"
        },
        {
          "name": "Compile installable package and safe uninstaller",
          "shell": "pwsh",
          "run": "$env:NSISDIR = Join-Path $env:GITHUB_WORKSPACE \"incoming/nsis\"\nPush-Location build/installer\n& \"$env:NSISDIR/Bin/makensis.exe\" /INPUTCHARSET UTF8 RepoWeave.nsi\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\nPop-Location"
        },
        {
          "name": "Install test automation without browser downloads",
          "shell": "pwsh",
          "env": {
            "PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD": "1"
          },
          "run": "npm install --prefix ci --no-audit --no-fund @playwright/test@1.56.1"
        },
        {
          "name": "Install, launch, check DPAPI, restart, update and uninstall on Windows",
          "shell": "pwsh",
          "run": "node verify-installed.cjs\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }"
        },
        {
          "name": "Report actual Windows verification",
          "if": "always()",
          "shell": "python",
          "run": "from pathlib import Path\nif Path(\"windows-verification.json\").exists(): print(\"REPOWEAVE_WINDOWS_VERIFICATION=\"+Path(\"windows-verification.json\").read_text())"
        },
        {
          "name": "Publish only verified packages",
          "shell": "python",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "import os,json,urllib.request,hashlib\nfrom pathlib import Path\nrepo='deospero/RepoWeave-Releases';token=os.environ['GH_TOKEN'];api='https://api.github.com/repos/'+repo+'/'\nassert json.loads(Path('windows-verification.json').read_text())['passed']\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n def redirect_request(self,*args,**kwargs):return None\nopener=urllib.request.build_opener(NoRedirect)\ndef call(method,url,body=None,kind='application/json'):\n assert url.startswith(api)or url.startswith('https://uploads.github.com/repos/'+repo+'/')\n req=urllib.request.Request(url,data=body,method=method,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':kind,'User-Agent':'RepoWeave-release','X-GitHub-Api-Version':'2026-03-10'})\n with opener.open(req,timeout=240)as r:return json.loads(r.read())\nmeta=json.loads(Path('ci-state.json').read_text());notes=Path('incoming/NOTES.md').read_text();tag='v0.4.0'\nreleases=call('GET',api+'releases?per_page=100');matches=[r for r in releases if r['tag_name']==tag];assert len(matches)<=1\nr=matches[0]if matches else call('POST',api+'releases',json.dumps({'tag_name':tag,'target_commitish':os.environ['RELEASE_SHA'],'name':'RepoWeave 0.4.0','body':notes,'draft':True,'prerelease':False}).encode())\nrid=str(r['id']);assert rid.isdigit();assets={a['name']:a for a in r['assets']}\nfiles=[Path('RepoWeave-0.4.0.apk'),Path('build/installer/RepoWeave-0.4.0-Windows-x64-Setup.exe')]\nchecksums=''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name+'\\n'for f in files);Path('SHA256SUMS.txt').write_text(checksums);files.append(Path('SHA256SUMS.txt'))\nfor f in files:\n digest=hashlib.sha256(f.read_bytes()).hexdigest()\n if f.name in assets:assert assets[f.name].get('digest')=='sha256:'+digest,'Existing published asset differs; refusing overwrite'\n else:\n  a=call('POST','https://uploads.github.com/repos/'+repo+'/releases/'+rid+'/assets?name='+f.name,f.read_bytes(),'application/octet-stream');assert a['size']==f.stat().st_size\nif r.get('draft'):call('PATCH',api+'releases/'+rid,json.dumps({'draft':False,'make_latest':'true'}).encode())\nfinal=call('GET',api+'releases/'+rid);assert not final['draft'];print('Published:',final['html_url']);print(checksums)\n"
        }
      ]
    }
  }
}