name: Publish verified RepoWeave APK
on:
  push:
    branches: [main]
    paths: [release-inputs/latest.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repoweave-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'deospero/RepoWeave-Releases'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify package bytes and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, tempfile, urllib.request
          repo = os.environ['GH_REPO']
          assert repo == 'deospero/RepoWeave-Releases'
          commit = os.environ['RELEASE_COMMIT']
          assert re.fullmatch(r'[0-9a-f]{40}', commit)
          base = 'https://raw.githubusercontent.com/' + repo + '/' + commit + '/'
          def fetch(path):
              request = urllib.request.Request(base + path, headers={'User-Agent':'RepoWeave-release'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = response.read(32 * 1024 * 1024)
                  assert not response.read(1), 'Release input too large'
                  return data
          meta = json.loads(fetch('release-inputs/latest.json'))
          version = meta['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version)
          name = 'RepoWeave-' + version + '.apk'
          root = 'release-inputs/' + version + '/'
          parts = meta.get('parts')
          if parts:
              assert isinstance(parts, list) and len(parts) <= 32
              assert parts == [f'part-{i:03d}' for i in range(len(parts))]
              package = b''.join(fetch(root + part) for part in parts)
          else:
              package = fetch(root + name)
          assert hashlib.sha256(package).hexdigest() == meta['sha256'], 'APK checksum mismatch'
          assert len(package) == meta['sizeBytes'], 'APK size mismatch'
          notes = fetch(root + 'NOTES.md').decode('utf-8')
          tag = 'v' + version
          work = pathlib.Path(tempfile.mkdtemp(prefix='repoweave-release-'))
          apk = work / name
          apk.write_bytes(package)
          checksum = work / 'SHA256SUMS.txt'
          checksum.write_text(meta['sha256'] + '  ' + name + '\n')
          notesfile = work / 'NOTES.md'
          notesfile.write_text(notes)
          # The tag endpoint returns published releases only. Drafts are addressed by ID.
          import urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          def request(method, url, body=None, kind='application/json'):
              assert url.startswith('https://api.github.com/repos/' + repo + '/') or url.startswith('https://uploads.github.com/repos/' + repo + '/')
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'RepoWeave-release', 'Content-Type': kind, 'X-GitHub-Api-Version': '2022-11-28'}
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              with opener.open(req, timeout=120) as response:
                  return json.loads(response.read())
          api = 'https://api.github.com/repos/' + repo + '/'
          releases = request('GET', api + 'releases?per_page=100')
          matches = [r for r in releases if r['tag_name'] == tag]
          assert len(matches) <= 1, 'Duplicate release tags; inspect before retrying'
          if matches:
              release = matches[0]
          else:
              payload = {'tag_name': tag, 'target_commitish': commit, 'name': 'RepoWeave ' + version, 'body': notes, 'draft': True, 'prerelease': False}
              release = request('POST', api + 'releases', json.dumps(payload).encode())
          release_id = str(release['id'])
          assert release_id.isdigit()
          assets = {asset['name']: asset for asset in release.get('assets', [])}
          for file in [apk, checksum]:
              if file.name in assets:
                  assert assets[file.name]['size'] == file.stat().st_size, 'Existing asset size differs; refusing overwrite'
                  assert assets[file.name].get('digest') == 'sha256:' + hashlib.sha256(file.read_bytes()).hexdigest(), 'Existing asset checksum missing or differs; refusing overwrite'
                  continue
              upload = 'https://uploads.github.com/repos/' + repo + '/releases/' + release_id + '/assets?name=' + file.name
              asset = request('POST', upload, file.read_bytes(), 'application/octet-stream')
              assert asset['size'] == file.stat().st_size
          if release.get('draft'):
              request('PATCH', api + 'releases/' + release_id, json.dumps({'draft':False, 'make_latest':'true'}).encode())
          final = request('GET', api + 'releases/' + release_id)
          assert not final['draft'] and not final['prerelease']
          assert name in {asset['name'] for asset in final['assets']}
          print('Published:', final['html_url'])
          print('SHA256:', meta['sha256'])
          PY
